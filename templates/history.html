<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SentinelX | Scan History</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #07111f;
            color: #e5e7eb;
            min-height: 100vh;
        }

        .header {
            background: #0b1628;
            border-bottom: 1px solid #1e293b;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #38bdf8;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 4px;
        }

        .nav a {
            color: #cbd5e1;
            text-decoration: none;
            margin-left: 25px;
            font-size: 14px;
        }

        .nav a:hover {
            color: #38bdf8;
        }

        .container {
            width: 92%;
            max-width: 1400px;
            margin: 35px auto;
        }

        .page-title {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .page-description {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        .card {
            background: #0b1628;
            border: 1px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #111e32;
            color: #94a3b8;
            text-align: left;
            padding: 16px;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 16px;
            border-top: 1px solid #1e293b;
            font-size: 14px;
            vertical-align: top;
        }

        tr:hover {
            background: #0f1d31;
        }

        .ioc {
            color: #38bdf8;
            font-family: Consolas, monospace;
            word-break: break-all;
            max-width: 360px;
        }

        .score {
            font-weight: bold;
        }

        .low {
            color: #4ade80;
        }

        .medium {
            color: #facc15;
        }

        .high {
            color: #fb923c;
        }

        .critical {
            color: #ef4444;
        }

        .decision {
            font-weight: bold;
        }

        .allow {
            color: #4ade80;
        }

        .alert {
            color: #facc15;
        }

        .block {
            color: #ef4444;
        }

        .empty {
            text-align: center;
            padding: 70px 20px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .indicator {
            color: #cbd5e1;
            font-size: 13px;
            line-height: 1.6;
        }

        .summary {
            color: #94a3b8;
            max-width: 400px;
            line-height: 1.5;
        }

        .refresh {
            background: #0284c7;
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .refresh:hover {
            background: #0369a1;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        @media (max-width: 800px) {

            .header {
                padding: 18px 20px;
            }

            .nav a {
                margin-left: 10px;
            }

            .container {
                width: 95%;
            }

            th,
            td {
                padding: 12px;
            }
        }

    </style>

</head>

<body>

    <header class="header">

        <div>
            <div class="logo">◈ SentinelX</div>
            <div class="subtitle">
                AI-Powered Security Operations & Threat Detection Platform
            </div>
        </div>

        <nav class="nav">
            <a href="/">Dashboard</a>
            <a href="/history">Scan History</a>
            <a href="/incidents">Incidents</a>
        </nav>

    </header>


    <main class="container">

        <div class="topbar">

            <div>
                <h1 class="page-title">Scan History</h1>

                <p class="page-description">
                    Historical record of IOC security analysis performed by SentinelX.
                </p>
            </div>

            <button class="refresh" onclick="loadHistory()">
                ↻ Refresh
            </button>

        </div>


        <div class="card">

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Time</th>
                            <th>IOC</th>
                            <th>Classification</th>
                            <th>Risk</th>
                            <th>Severity</th>
                            <th>Decision</th>
                            <th>Indicators</th>
                            <th>Summary</th>
                        </tr>

                    </thead>

                    <tbody id="historyBody">

                        <tr>
                            <td colspan="8">
                                <div class="empty">
                                    <div class="empty-icon">⏳</div>
                                    Loading scan history...
                                </div>
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>


    <script>

        async function loadHistory() {

            const body = document.getElementById("historyBody");

            try {

                const response = await fetch("/api/history");

                const history = await response.json();

                if (!history || history.length === 0) {

                    body.innerHTML = `
                        <tr>
                            <td colspan="8">
                                <div class="empty">
                                    <div class="empty-icon">◌</div>
                                    No scans recorded yet.
                                </div>
                            </td>
                        </tr>
                    `;

                    return;
                }


                body.innerHTML = history
                    .slice()
                    .reverse()
                    .map(scan => {

                        const severity =
                            (scan.severity || "LOW").toLowerCase();

                        const decision =
                            (scan.decision || "ALLOW").toLowerCase();

                        const indicators =
                            (scan.indicators || [])
                                .map(item => `• ${escapeHtml(item)}`)
                                .join("<br>");

                        return `

                            <tr>

                                <td>
                                    ${escapeHtml(scan.timestamp || "-")}
                                </td>

                                <td class="ioc">
                                    ${escapeHtml(scan.ioc || "-")}
                                </td>

                                <td>
                                    ${escapeHtml(scan.classification || "-")}
                                </td>

                                <td class="score">
                                    ${escapeHtml(String(scan.risk_score ?? 0))}/100
                                </td>

                                <td class="${severity}">
                                    ${escapeHtml(scan.severity || "-")}
                                </td>

                                <td class="decision ${decision}">
                                    ${escapeHtml(scan.decision || "-")}
                                </td>

                                <td class="indicator">
                                    ${indicators || "-"}
                                </td>

                                <td class="summary">
                                    ${escapeHtml(scan.summary || "-")}
                                </td>

                            </tr>

                        `;

                    })
                    .join("");

            }

            catch (error) {

                body.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty">
                                <div class="empty-icon">⚠</div>
                                Unable to load scan history.
                            </div>
                        </td>
                    </tr>
                `;

                console.error(error);

            }

        }


        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        loadHistory();

    </script>

</body>

</html>
